<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dining &amp; Map - Campus Life Super App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
            <a class="navbar-brand" href="index.html">Campus Life</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link active" href="map.html">Dining &amp; Map</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h1 class="mb-4">Dining &amp; Campus Map</h1>

        <input type="text" id="location-search" class="form-control mb-4" placeholder="Search for a building or dining hall...">

        <!-- ============ MAP + LOCATION LIST (Flexbox layout) ============ -->
        <div class="map-layout">
            <div class="map-area">
                <p>Interactive campus map placeholder</p>
            </div>

            <div class="location-list">
                <h2 class="h5">Dining Locations</h2>
                <ul id="location-items" class="list-group">
                    <!-- Locations are added here by JavaScript -->
                    <li class="list-group-item" data-location="North Hall Dining">North Hall Dining</li>
                    <li class="list-group-item" data-location="Student Union Cafe">Student Union Cafe</li>
                    <li class="list-group-item" data-location="South Commons">South Commons</li>
                    <li class="list-group-item" data-location="Library Coffee Cart">Library Coffee Cart</li>
                </ul>
            </div>
        </div>

        <!-- Selected location detail box, updated by click event listeners -->
        <div id="location-detail" class="alert alert-secondary mt-4">
            Click a location on the list to see details here.
        </div>
    </main>

    <footer class="text-center py-3 bg-dark text-white mt-5">
        <p class="mb-0">&copy; 2026 Campus Life Super App</p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
