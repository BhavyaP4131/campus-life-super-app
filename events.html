<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Campus Life Super App</title>
    <meta name="description" content="Browse and RSVP to upcoming campus events.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3" aria-label="Main navigation">
            <a class="navbar-brand" href="index.html">Campus Life</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                    aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="events.html" aria-current="page">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="map.html">Dining &amp; Map</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container my-5">
        <h1 class="mb-4">Campus Events</h1>

        <!-- Search + Load controls -->
        <div class="row mb-4 g-2">
            <div class="col-md-8">
                <label for="event-search" class="visually-hidden">Search events</label>
                <input type="text" id="event-search" class="form-control" placeholder="Search events..." aria-label="Search events">
            </div>
            <div class="col-md-4">
                <button id="load-events-btn" class="btn btn-primary w-100">Load Events</button>
            </div>
        </div>

        <!-- aria-live region: screen readers announce when new events load or an error occurs -->
        <p id="event-status" class="text-muted" aria-live="polite">Click "Load Events" to fetch upcoming campus events.</p>

        <div id="event-container" class="row g-3">
            <!-- Event cards render here after the API call -->
        </div>
    </main>

    <footer class="text-center py-3 bg-dark text-white mt-5">
        <p class="mb-0">&copy; 2026 Campus Life Super App</p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
